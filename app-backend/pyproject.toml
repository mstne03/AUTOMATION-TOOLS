[project]
name = "app-backend"
version = "0.1.0"
description = "Sidecar local (FastAPI) del producto: agente con tools de youtube-mcp-server y kb-seo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "anthropic>=0.80",
    "keyring>=25",
    "python-dotenv>=1.0",
    "cryptography>=42",
    "httpx>=0.27",
    "youtube-studio-mcp",
    "kb-seo",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
app-backend = "app_backend.main:main"

[tool.uv.sources]
youtube-studio-mcp = { path = "../youtube-mcp-server", editable = true }
kb-seo = { path = "../kb-seo", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app_backend"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

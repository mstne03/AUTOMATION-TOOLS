# Fuentes de la base de conocimiento. Este archivo es la fuente de verdad.
# `uv run ingest all` procesa todas las entradas de aqui.
# `uv run ingest url <url> ...` anade una entrada y la ingiere.
#
# Campos:
#   url          (obligatorio) URL o ruta local
#   type         web | youtube | pdf | local   (si se omite, se adivina)
#   platforms    lista: youtube, tiktok, instagram, general
#   published_at YYYY-MM-DD. La busqueda permite filtrar por fecha minima.
#   author       opcional
#   topics       lista libre de etiquetas
#
# Convencion sobre fechas:
#   Las paginas de documentacion oficial no tienen fecha de publicacion real
#   (son documentos vivos que las plataformas van editando). trafilatura les
#   saca la fecha del aviso de copyright del pie, que es basura (2005, 2009).
#   Para esas se fija a mano la fecha de la ultima verificacion y se marcan con
#   el topic `doc-oficial-viva`. Donde la fecha SI es real (posts de blog y de
#   newsroom con fecha propia) se respeta la original.


services:
  db:
    image: pgvector/pgvector:pg17
    container_name: kb_seo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      # Los lee init.sql via psql para crear los dos roles.
      KB_WRITER_USER: ${KB_WRITER_USER}
      KB_WRITER_PASSWORD: ${KB_WRITER_PASSWORD}
      KB_READER_USER: ${KB_READER_USER}
      KB_READER_PASSWORD: ${KB_READER_PASSWORD}
    ports:
      # Solo localhost. Nunca 0.0.0.0.
      - "127.0.0.1:5433:5432"
    volumes:
      - kb_seo_pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kb_seo_pgdata:
    name: kb_seo_pgdata

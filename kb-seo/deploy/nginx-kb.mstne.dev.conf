# /etc/nginx/sites-available/kb.mstne.dev  (install.sh lo copia y lo enlaza)
# Solo lectura: ficheros estaticos de /var/www/kb. Sin autenticacion a proposito:
# no hay datos de usuario y la firma minisign es la garantia de integridad.
# certbot --nginx -d kb.mstne.dev anade despues el bloque TLS y la redireccion 80->443.
server {
    listen 80;
    server_name kb.mstne.dev;

    root /var/www;
    autoindex off;

    # Solo los tres ficheros publicados; todo lo demas, 404.
    location = /kb/manifest.json         { add_header Cache-Control "no-cache"; }
    location = /kb/manifest.json.minisig { add_header Cache-Control "no-cache"; }
    location = /kb/kb-public.sqlite      { add_header Cache-Control "public, max-age=3600"; }
    location /                           { return 404; }
}

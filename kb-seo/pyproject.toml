[project]
name = "kb-seo"
version = "0.1.0"
description = "Base de conocimiento local sobre SEO y algoritmos de redes sociales"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "trafilatura>=2.0",
    "youtube-transcript-api>=1.0",
    "pypdf>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "mcp>=2.0",
    "python-dotenv>=1.0",
    "fastembed>=0.7",
    "sqlite-vec>=0.1.6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
browser = ["playwright>=1.47"]

[project.scripts]
ingest = "ingest.cli:main"
kb-migrate = "kb.db:migrate_main"
kb-mcp = "mcp_server.server:main"
kb-export = "kb.export:main"
kb-sign = "kb.sign:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb", "ingest", "mcp_server"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

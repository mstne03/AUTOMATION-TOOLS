<!doctype html>
<!--
  Capa con un clip del usuario sobre una escena (T7). Mismos encuadres que capa-foto. El clip ya viene normalizado (H.264, sin audio,
  CFR). Un clip horizontal se ve entero sobre un fondo desenfocado: el fondo es un fotograma fijo del clip (PNG, {{FONDO_HTML}}) con
  CSS `filter: blur()`, porque `boxblur` y `gblur` no están en el ffmpeg LGPL (M-D7); el fondo no se mueve.
  El <video> lo maneja HyperFrames por data-start/data-duration (mudo, sin audio propio); el movimiento va en el contenedor.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="{{ID}}" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURACION}}" data-width="1080" data-height="1920">
      <style>
        #{{ID}} { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
        #{{ID}} .capa { position: absolute; inset: 0; }
        #{{ID}} .mov { position: absolute; inset: 0; overflow: hidden; }
        #{{ID}}.enc-marco .mov { inset: auto; left: 90px; top: 330px; width: 900px; height: 1200px; border-radius: 28px; border: 8px solid var(--acento); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
        #{{ID}} .fondo { position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(36px) brightness(0.7); }
        #{{ID}}-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #{{ID}}.horizontal #{{ID}}-video { object-fit: contain; }
        #{{ID}}.enc-paneo #{{ID}}-video { transform: scale(1.18); }
        #{{ID}}.enc-paneo.horizontal #{{ID}}-video { transform: none; }
      </style>
      <div id="{{ID}}-escena" class="clip" data-start="0" data-duration="{{DURACION}}" data-track-index="0" data-layout-allow-overflow style="position: absolute; inset: 0; overflow: hidden">
        <div id="{{ID}}-fundido" class="capa">
          <div id="{{ID}}-mov" class="mov">
            {{FONDO_HTML}}
            <video id="{{ID}}-video" class="clip" src="assets/{{MEDIO}}" muted playsinline data-start="0" data-duration="{{DURACION}}" data-track-index="1"></video>
          </div>
        </div>
      </div>
      <script id="{{ID}}-datos" type="application/json">{{DATOS}}</script>
      <script>
        (function () {
          var id = "{{ID}}";
          var D = {{DURACION}};
          var d = JSON.parse(document.getElementById(id + "-datos").textContent);
          var raiz = document.getElementById(id);
          raiz.setAttribute("class", "enc-" + d.encuadre + (d.horizontal ? " horizontal" : ""));
          var hf = HF.contexto(id, {{INICIO}});
          var f = Math.min(0.3, D / 3);
          hf.tween("#" + id + "-fundido", { opacity: 0 }, { opacity: 1 }, 0, f, "none");
          hf.tween("#" + id + "-fundido", { opacity: 1 }, { opacity: 0 }, Math.max(0, D - f), f, "none", { antes: false });
          if (d.encuadre === "zoom") hf.tween("#" + id + "-mov", { scale: 1 }, { scale: 1.12 }, 0, D, "none");
          else if (d.encuadre === "paneo") hf.tween("#" + id + "-mov", { x: -60 }, { x: 60 }, 0, D, "none");
          else hf.tween("#" + id + "-mov", { scale: 0.94 }, { scale: 1 }, 0, Math.min(0.35, D / 3), "expo.out");
        })();
      </script>
    </div>
  </body>
</html>

<!doctype html>
<!-- Destello blanco global: en cada cambio de bloque y en el golpe. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="flash" data-composition-id="flash" data-start="0" data-duration="{{DURACION}}" data-width="1080" data-height="1920">
      <style>
        #flash { position: relative; width: 1080px; height: 1920px; pointer-events: none; }
        #flash-luz { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      </style>
      <div id="flash-luz" class="clip" data-start="0" data-duration="{{DURACION}}" data-track-index="0" data-layout-ignore data-layout-allow-occlusion></div>
      <script id="flash-datos" type="application/json">{{DATOS}}</script>
      <script>
        (function () {
          var d = JSON.parse(document.getElementById("flash-datos").textContent);
          var hf = HF.contexto("{{ID}}", {{INICIO}});
          d.destellos.forEach(function (e) {
            // hf-tiempo solo comprueba los números; una opacidad que no lo sea se descartaría en silencio (I11).
            hf.numero(e.opacidad, "flash: opacidad");
            hf.tween("#flash-luz", { opacity: 0 }, { opacity: e.opacidad }, e.t, e.sube, "none", { antes: false });
            hf.tween("#flash-luz", { opacity: e.opacidad }, { opacity: 0 }, e.t + e.sube, e.baja, "power2.out", { antes: false });
          });
        })();
      </script>
    </div>
  </body>
</html>

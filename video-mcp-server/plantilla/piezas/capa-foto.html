<!doctype html>
<!--
  Capa con una foto del usuario sobre una escena (T7). Encuadres: marco (tarjeta centrada), zoom (a sangre, con acercamiento lento) y
  paneo (a sangre, desplazamiento lateral). La foto ya viene normalizada (PNG). Sin innerHTML ni lectura de tiempos del DOM: todo el
  movimiento sale de HF.contexto; {{DATOS}} lleva el encuadre como JSON escapado y {{MEDIO}} el nombre del fichero que pone el motor.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="{{ID}}" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURACION}}" data-width="1080" data-height="1920">
      <style>
        #{{ID}} { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
        #{{ID}} .capa { position: absolute; inset: 0; }
        #{{ID}} .mov { position: absolute; inset: 0; overflow: hidden; }
        #{{ID}}.enc-marco .mov { inset: auto; left: 90px; top: 330px; width: 900px; height: 1200px; border-radius: 28px; border: 8px solid var(--acento); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
        #{{ID}}-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #{{ID}}.enc-paneo #{{ID}}-img { transform: scale(1.18); }
      </style>
      <div id="{{ID}}-escena" class="clip" data-start="0" data-duration="{{DURACION}}" data-track-index="0" data-layout-allow-overflow style="position: absolute; inset: 0; overflow: hidden">
        <div id="{{ID}}-fundido" class="capa">
          <div id="{{ID}}-mov" class="mov">
            <img id="{{ID}}-img" src="assets/{{MEDIO}}" alt="" />
          </div>
        </div>
      </div>
      <script id="{{ID}}-datos" type="application/json">{{DATOS}}</script>
      <script>
        (function () {
          var id = "{{ID}}";
          var D = {{DURACION}};
          var d = JSON.parse(document.getElementById(id + "-datos").textContent);
          document.getElementById(id).setAttribute("class", "enc-" + d.encuadre);
          var hf = HF.contexto(id, {{INICIO}});
          var f = Math.min(0.3, D / 3);
          hf.tween("#" + id + "-fundido", { opacity: 0 }, { opacity: 1 }, 0, f, "none");
          hf.tween("#" + id + "-fundido", { opacity: 1 }, { opacity: 0 }, Math.max(0, D - f), f, "none", { antes: false });
          if (d.encuadre === "zoom") hf.tween("#" + id + "-mov", { scale: 1 }, { scale: 1.12 }, 0, D, "none");
          else if (d.encuadre === "paneo") hf.tween("#" + id + "-mov", { x: -60 }, { x: 60 }, 0, D, "none");
          else hf.tween("#" + id + "-mov", { scale: 0.94 }, { scale: 1 }, 0, Math.min(0.35, D / 3), "expo.out");
        })();
      </script>
    </div>
  </body>
</html>

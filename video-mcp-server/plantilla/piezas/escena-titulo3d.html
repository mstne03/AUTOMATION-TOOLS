<!doctype html>
<!--
  Escena `titulo3d`: adaptación vertical de extruded-logo (catálogo), con los arreglos de referencia-v2
  (import map con rutas "./" en el index y Three.js 0.184 local).
  Cambios: lienzo 1080×1920, cámara de 26° al doble de distancia reencuadrada para vertical, palabra
  escalada a ~1000 px de ancho y centrada a ~700 px, hasta 12 caracteres, sin tagline, acabado oro con luz
  de borde del color de acento, y el render movido por un setter (seek no dispara onUpdate).
  Fuente: Geist Bold (OFL) en typeface JSON, con los contornos de H, L y F corregidos.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="{{ID}}" data-composition-id="{{ID}}" data-start="0" data-duration="{{DURACION}}" data-width="1080" data-height="1920">
      <style>
        #{{ID}} { position: relative; width: 1080px; height: 1920px; overflow: hidden;
          background: radial-gradient(700px 900px at 50% 40%, rgba(255, 255, 255, 0.08), transparent 70%), var(--fondo); }
        #{{ID}} .capa { position: absolute; inset: 0; }
        #{{ID}}-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      </style>
      <div id="{{ID}}-escena" class="clip" data-start="0" data-duration="{{DURACION}}" data-track-index="0" data-layout-allow-overflow style="position: absolute; inset: 0">
        <div id="{{ID}}-fundido" class="capa">
          <div id="{{ID}}-golpe" class="capa">
            <div id="{{ID}}-punch" class="capa">
              <canvas id="{{ID}}-canvas" width="1080" height="1920"></canvas>
            </div>
          </div>
        </div>
      </div>
      <script id="{{ID}}-datos" type="application/json">{{DATOS}}</script>
      <script>
        (function () {
          var id = "{{ID}}";
          var d = JSON.parse(document.getElementById(id + "-datos").textContent);
          var tl = gsap.timeline({ paused: true });
          {{ENVOLTURA}}
          var host = { datos: d, render: null, t: 0 };
          window["__titulo3d_" + id] = host;
          window.__hf = window.__hf || {};
          window.__hf.buildReady = window.__hf.buildReady || {};
          window.__hf.buildReady[id] = new Promise(function (ok) { host.listo = ok; });
          var reloj = { _t: 0 };
          Object.defineProperty(reloj, "t", {
            get: function () { return this._t; },
            set: function (v) { this._t = v; host.t = v; if (host.render) host.render(v); },
          });
          tl.fromTo(reloj, { t: 0 }, { t: d.duracion, duration: d.duracion, ease: "none" }, 0);
          window.__timelines = window.__timelines || {};
          window.__timelines[id] = tl;
        })();
      </script>
      <script type="module">
        import * as THREE from "three";
        import { FontLoader } from "three/addons/loaders/FontLoader.js";
        import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

        const host = window["__titulo3d_{{ID}}"];
        const d = host.datos;
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("{{ID}}-canvas"), antialias: true, alpha: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1);
        renderer.setSize(1080, 1920, false);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;

        const scene = new THREE.Scene();
        const studio = new THREE.Scene();
        studio.background = new THREE.Color(0x040406);
        const softbox = (w, h, x, y, z, color, power) => {
          const mat = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide });
          const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
          panel.position.set(x, y, z);
          panel.lookAt(0, 0, 0);
          studio.add(panel);
        };
        softbox(10, 2.2, 0, 7, 1, 0xffffff, 3);
        softbox(1.2, 7, -7, 1, 2, 0xffffff, 2.2);
        softbox(1.2, 7, 7, 1, -1, 0xffffff, 1.6);
        const bars = document.createElement("canvas");
        bars.width = 1024;
        bars.height = 256;
        const bg = bars.getContext("2d");
        const fade = bg.createLinearGradient(0, 0, 0, 256);
        fade.addColorStop(0, "#9a9ca3");
        fade.addColorStop(1, "#15161a");
        bg.fillStyle = fade;
        bg.fillRect(0, 0, 1024, 256);
        bg.fillStyle = "#ffffff";
        for (const [x, w] of [[150, 60], [430, 140], [760, 36]]) bg.fillRect(x, 0, w, 256);
        const mirror = new THREE.Mesh(
          new THREE.PlaneGeometry(22, 8),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(bars), color: new THREE.Color(2.2, 2.2, 2.2), side: THREE.DoubleSide }),
        );
        mirror.position.set(0, 1, 9);
        mirror.lookAt(0, 1, 0);
        studio.add(mirror);
        softbox(9, 1.4, 0, 0.5, -7, d.acento, 2);
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(studio, 0.01).texture;

        // Vertical: el mismo campo de 26° del original con la cámara más lejos (22 en vez de 11), para que la
        // palabra quepa a lo ancho sin que las letras de los extremos se vean de lado.
        const DIST = 22;
        const FOV = 26;
        const camera = new THREE.PerspectiveCamera(FOV, 1080 / 1920, 0.1, 100);
        const rim = new THREE.DirectionalLight(new THREE.Color(d.acento), 5);
        rim.position.set(0, 3, -6);
        scene.add(rim);
        const key = new THREE.DirectionalLight(0xffffff, 1.4);
        key.position.set(-5, 4, 6);
        scene.add(key);
        const material = new THREE.MeshStandardMaterial({ color: 0xe7bf6a, metalness: 1, roughness: 0.2 });

        const font = await new FontLoader().loadAsync("assets/fonts/Geist-Bold.typeface.json");
        const text = String(d.texto).toUpperCase().slice(0, 12).split("");
        const SIZE = 1.5;
        const scale = SIZE / font.data.resolution;
        const tracking = 0.08;
        const word = new THREE.Group();
        scene.add(word);
        const letters = [];
        let cursor = 0;
        for (const ch of text) {
          const advance = ((font.data.glyphs[ch] || font.data.glyphs["?"]).ha || 600) * scale;
          if (ch.trim()) {
            const geometry = new TextGeometry(ch, { font, size: SIZE, depth: 0.42, curveSegments: 10, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.035, bevelSegments: 5 });
            geometry.computeBoundingBox();
            const b = geometry.boundingBox;
            geometry.translate(-(b.min.x + b.max.x) / 2, 0, -0.21);
            const pivot = new THREE.Group();
            pivot.position.x = cursor + advance / 2;
            pivot.add(new THREE.Mesh(geometry, material));
            word.add(pivot);
            letters.push(pivot);
          }
          cursor += advance + tracking;
        }
        const width = cursor - tracking;
        for (const p of letters) p.position.x -= width / 2;
        // Ancho visible a DIST unidades; la palabra ocupa como mucho ~1000 px (92 % del ancho).
        const alto = 2 * DIST * Math.tan((FOV * Math.PI) / 360);
        const visible = alto * (1080 / 1920);
        const s = Math.min(1.6, (visible * 0.92) / width);
        word.scale.setScalar(s);
        // Centro de las letras a ~700 px (por encima de la franja de subtítulos): 260 px sobre el centro.
        const centro = (SIZE * s) / 2;
        const sube = (260 / 1920) * alto;
        camera.position.set(0, centro - sube + 0.3, DIST);
        camera.lookAt(0, centro - sube, 0);

        const clamp01 = (x) => Math.min(1, Math.max(0, x));
        const easeOutBack = (x) => { const u = clamp01(x) - 1; return 1 + 2.2 * u * u * u + 1.2 * u * u; };
        const easeInOut = (x) => { const u = clamp01(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
        host.render = (t) => {
          const D = d.duracion;
          const k = Math.min(1, D / 5);
          letters.forEach((p, i) => {
            const t0 = d.empieza + 0.1 * k + i * 0.13 * k;
            const u = easeOutBack((t - t0) / (0.9 * k));
            p.rotation.x = (1 - u) * (-Math.PI / 2);
            p.position.y = (1 - clamp01(u)) * -0.2;
            p.visible = t >= t0;
          });
          const swing = easeInOut((t - 0.9 * k) / Math.max(0.1, D - 0.9 * k - 0.7 * k));
          word.rotation.y = -0.42 + swing * 0.42;
          word.rotation.x = 0.04 - swing * 0.04;
          renderer.render(scene, camera);
        };
        host.render(host.t);
        host.listo();
      </script>
    </div>
  </body>
</html>

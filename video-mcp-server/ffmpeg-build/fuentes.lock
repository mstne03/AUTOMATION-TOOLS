# Fuentes fijadas del ffmpeg LGPL (I9). TSV con 11 columnas; «-» = no aplica.
# Las celdas PENDIENTE-TAREA-10 solo se rellenan en la Tarea 10 (con permiso de Marc para
# descargar) y descargar-fuentes.sh rechaza cualquier fila que aún lleve una.
#
# tipo   tar: tarball firmado (firma_url + huella + anclaje con ≥ 2 canales, R0 H1)
#        git: sin firma: commit de 40 hex + SHA-256 de `git archive --format=tar <commit> [ruta]`
#             (calculado en la imagen fijada) + canal2 (otro repo .git que debe dar lo mismo, L1)
#        apt: InRelease del snapshot de Debian (lo comprueba el Dockerfile, R0 M4)
#        meta: SOURCE_DATE_EPOCH = fecha de la release de ffmpeg (columna version)
# anclaje: «canal=HUELLA;canal=HUELLA», canal = debian:<paquete fuente> (su
#          debian/upstream/signing-key.asc en el mismo snapshot) o una página https:// de un host
#          distinto del de descarga. Nunca un keyserver ni la huella leída del propio .asc.
#
# nombre	version	tipo	url	sha256	commit	ruta	firma_url	huella	anclaje	canal2

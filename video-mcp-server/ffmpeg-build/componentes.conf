# shellcheck shell=bash disable=SC2034
# FUENTE ÚNICA de lo que lleva el ffmpeg LGPL de SEO Studio (W1.5, SEO-115).
# La leen con `source` compilar.sh (compone el ./configure y comprueba config_components.h),
# verificar-configuracion.sh (puerta de licencia) y verificar-binario.sh (listados exactos).
# Cambiar algo aquí exige justificarlo en el LEEME y que pasen tests/run.sh y la verificación del
# binario real.
#
# Base: --disable-everything y solo se habilita lo listado. LGPL-2.1-o-posterior: ninguna
# biblioteca enlazada exige --enable-version3, y jamás --enable-gpl ni --enable-nonfree.

FF_CONFIGURE_ENABLE=(
  --disable-everything --disable-autodetect --disable-doc --disable-debug --disable-network
  --disable-ffplay --disable-w32threads
  --enable-ffmpeg --enable-ffprobe --enable-avdevice --enable-pthreads
  --enable-zlib          # PNG y MOV comprimido
  --enable-libdav1d      # único decodificador software de AV1 (I15 acepta AV1 en clips)
  --enable-ffnvcodec --enable-nvenc   # h264_nvenc (NVIDIA)
  --enable-amf           # h264_amf (AMD)
  --enable-mediafoundation            # h264_mf (modo Compatible; en Intel usa el MFT de hardware)
)

# Lista blanca de opciones booleanas --enable-X: las de arriba más la cruzada, nada más. Cualquier
# otra rompe verificar-configuracion.sh; para añadir una, se añade arriba (y se justifica).
FF_LISTA_BLANCA_ENABLE=(--enable-cross-compile)
for _o in "${FF_CONFIGURE_ENABLE[@]}"; do [[ "$_o" != --enable-* ]] || FF_LISTA_BLANCA_ENABLE+=("$_o"); done
unset _o

# --enable-<tipo>=<lista>: la configuración real debe tener EXACTAMENTE estas listas.
# protocol: todo es fichero local o tubería; sin http/tcp/concat:/subfile/crypto (A2). Ojo: `file`
#   en Windows resuelve rutas UNC (\\host\…): eso lo cierra el motor (LEEME, «Protocolos y UNC»).
#   `fd`: desde 7.0 la CLI traduce `-` (stdin/stdout) a fd:, no a pipe: (visto en el binario real).
# demuxer: I15 (JPEG/PNG/WebP; MP4/MOV/WebM; MP3/WAV/FLAC/OGG/M4A); image2pipe/concat/nut/rawvideo
#   los usa HyperFrames. Nombres de COMPONENTE de configure: en 7.1.5 los *_pipe se llaman
#   image_png_pipe, etc. (el binario los lista como png_pipe: verificar-binario.sh quita image_).
# decoder: vp8 lo usa el decodificador WebP con pérdida; prores lee el intermedio; wrapped_avframe
#   recibe los fotogramas de `-f lavfi` (sin él, el sondeo de codificadores del motor falla siempre).
# encoder: D11 (intermedio ProRes 4444, H.264 por GPU o h264_mf, AAC nativo). Sin QSV (R0).
#   wrapped_avframe: lo pide `-f null -` para descartar el vídeo (sondeos y decodificación).
# bsf: h264/hevc_mp4toannexb salían por h264_qsv: fuera con QSV.
# indev: HyperFrames y el motor sondean NVENC con `-f lavfi -i color=…`.
declare -A FF_LISTAS=(
  [protocol]="file pipe fd"
  [demuxer]="mov matroska image2 image2pipe image_png_pipe image_jpeg_pipe image_webp_pipe mp3 wav flac ogg concat rawvideo nut"
  [muxer]="mp4 mov wav nut null image2 image2pipe rawvideo"
  [decoder]="h264 hevc vp9 vp8 libdav1d mjpeg png webp prores rawvideo aac mp3float flac vorbis opus pcm_s16le pcm_s24le pcm_s32le pcm_f32le pcm_u8 wrapped_avframe"
  [encoder]="prores_ks h264_mf h264_nvenc h264_amf aac png pcm_s16le rawvideo wrapped_avframe"
  [parser]="h264 hevc vp9 av1 aac mpegaudio flac opus vorbis png mjpeg webp"
  [bsf]="extract_extradata av1_frame_split vp9_superframe_split aac_adtstoasc"
  [filter]="scale format setparams pad fps setpts trim crop overlay split color null showinfo hstack aresample aformat atrim asetpts apad adelay atempo afade amix volume pan loudnorm ebur128 anull asplit"
  [indev]="lavfi"
)
# Orden fijo de los tipos (el de un mapa de bash no lo es): así ./configure sale siempre igual.
FF_TIPOS=(protocol demuxer muxer decoder encoder parser bsf filter indev)

# Nunca, en ninguna lista ni en la configuración (comprobado por tests y por verificar-binario).
# movie/amovie/zmq/sendcmd: abren ficheros o puertos desde un filtro; hwaccel: superficie de GPU.
FF_PROHIBIDOS=(gpl nonfree version3 libx264 libx265 libopenh264 libvpx libvpx-vp9 libopus libmp3lame
  libvpl h264_qsv movie amovie zmq azmq sendcmd asendcmd)

# Lo que usa video-mcp-server/src y este build NO lleva, con motivo. Mientras haya alguno, este
# ffmpeg no sustituye a BtbN en el instalador (puerta W3.2, ver LEEME).
FF_EXCLUIDOS_CONOCIDOS=()

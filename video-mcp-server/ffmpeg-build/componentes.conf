# shellcheck shell=bash disable=SC2034
# FUENTE ÚNICA de lo que lleva el ffmpeg LGPL de SEO Studio (W1.5, SEO-115).
# La leen con `source` compilar.sh (compone el ./configure), verificar-configuracion.sh (lista
# blanca) y verificar-binario.sh (listados exactos). Cambiar algo aquí exige justificarlo en el
# LEEME y que pasen tests/run.sh y la verificación del binario real.
#
# Base: --disable-everything y solo se habilita lo listado. LGPL-2.1-o-posterior: ninguna
# biblioteca enlazada exige --enable-version3, y jamás --enable-gpl ni --enable-nonfree.

FF_CONFIGURE_ENABLE=(
  --disable-everything --disable-autodetect --disable-doc --disable-debug --disable-network
  --disable-ffplay --disable-w32threads
  --enable-ffmpeg --enable-ffprobe --enable-avdevice --enable-pthreads
  --enable-zlib          # PNG y MOV comprimido
  --enable-libdav1d      # único decodificador software de AV1 (I15 acepta AV1 en clips)
  --enable-ffnvcodec --enable-nvenc   # h264_nvenc (NVIDIA)
  --enable-amf           # h264_amf (AMD)
  --enable-mediafoundation            # h264_mf (modo Compatible; en Intel usa el MFT de hardware)
)

# Lista blanca de opciones booleanas --enable-X que puede llevar un build. Cualquier otra (aunque
# sea inocua) rompe verificar-configuracion.sh: se añade aquí a mano, con motivo.
FF_LISTA_BLANCA_ENABLE=(
  --enable-cross-compile
  --enable-ffmpeg --enable-ffprobe --enable-avdevice --enable-pthreads --enable-zlib --enable-libdav1d
  --enable-ffnvcodec --enable-nvenc --enable-amf --enable-mediafoundation
)

# --enable-<tipo>=<lista>: la configuración real debe tener EXACTAMENTE estas listas.
# Todo es fichero local o tubería; sin http/tcp/concat:/subfile/crypto (A2). Ojo: `file` en Windows
# resuelve rutas UNC (\\host\…): eso lo cierra el motor (ver LEEME, «Protocolos y UNC»).
FF_PROTOCOLS=(file pipe)
# I15: JPEG/PNG/WebP; MP4/MOV/WebM; MP3/WAV/FLAC/OGG/M4A. image2pipe/concat/nut/rawvideo: HyperFrames.
FF_DEMUXERS=(mov matroska image2 image2pipe png_pipe jpeg_pipe webp_pipe mp3 wav flac ogg concat rawvideo nut)
FF_MUXERS=(mp4 mov wav nut null image2 image2pipe rawvideo)
# vp8: lo usa el decodificador WebP con pérdida. prores: lee el intermedio de la segunda pasada.
FF_DECODERS=(h264 hevc vp9 vp8 libdav1d mjpeg png webp prores rawvideo
  aac mp3float flac vorbis opus pcm_s16le pcm_s24le pcm_s32le pcm_f32le pcm_u8)
# D11: intermedio ProRes 4444, H.264 por GPU (NVENC/AMF) o h264_mf, AAC nativo. Sin QSV (R0).
FF_ENCODERS=(prores_ks h264_mf h264_nvenc h264_amf aac png pcm_s16le rawvideo)
FF_PARSERS=(h264 hevc vp9 av1 aac mpegaudio flac opus vorbis png mjpeg webp)
# h264/hevc_mp4toannexb salían por h264_qsv: fuera con QSV.
FF_BSFS=(extract_extradata av1_frame_split vp9_superframe_split aac_adtstoasc)
FF_FILTERS=(
  scale format setparams pad fps setpts trim crop overlay split color null showinfo hstack
  aresample aformat atrim asetpts apad adelay atempo afade amix volume pan loudnorm ebur128 anull asplit
)
# HyperFrames y el motor sondean NVENC con `-f lavfi -i color=…`: lavfi como dispositivo de entrada.
FF_INDEVS=(lavfi)

# Nunca, en ninguna lista ni en la configuración (comprobado por tests y por verificar-binario).
# movie/amovie/zmq/sendcmd: abren ficheros o puertos desde un filtro; hwaccel: superficie de GPU.
FF_PROHIBIDOS=(gpl nonfree version3 libx264 libx265 libopenh264 libvpx libvpx-vp9 libopus libmp3lame
  libvpl h264_qsv movie amovie zmq azmq sendcmd asendcmd)

# Lo que usa video-mcp-server/src y este build NO lleva, con motivo. Mientras haya alguno, este
# ffmpeg no sustituye a BtbN en el instalador (puerta W3.2, ver LEEME).
FF_EXCLUIDOS_CONOCIDOS=(
  "libmp3lame|R1: musica.ts codifica MP3; el ruling R0 no añade LAME: musica.ts pasa a AAC/.m4a o WAV en otro paquete"
)
